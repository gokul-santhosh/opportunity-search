# ============================================================
# Harvest queries
#
# Built from a manual sweep that worked, not from guessing. Four principles,
# each learned the hard way:
#
#   1. NAME ORGANISATIONS, NOT CATEGORIES.
#      "GoSports Foundation athlete support" beats "sports foundation India".
#      Organisations are stable and well indexed. A category is answered with
#      listicles and aggregator spam.
#
#   2. PUT DEADLINE WORDS IN THE QUERY.
#      "last date", "notification", "applications open". This biases results
#      toward pages that actually state a date, which is what the scoring
#      rewards and what vague queries fail to find.
#
#   3. SEARCH FOR WHAT IS CLOSED.
#      "when open next" surfaced the fact that every college admission in the
#      country was shut for the season. Expired results are the calendar.
#
#   4. KEEP THEM SHORT. Three to five words. Padding like "junior archer
#      support" is how a fundraiser writes, not how a notification does.
# ============================================================

settings:
  results_per_query: 10
  max_searches_per_query: 3
  chain_new_organisations: true    # a name in a result gets its own query
  max_chained: 40
  cost_ceiling_usd: 20.00
  home_city: Coimbatore
  home_state: Tamil Nadu


# ============================================================
# BROAD — finds what nobody knew to look for
# ============================================================

