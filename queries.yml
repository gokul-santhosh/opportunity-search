# ============================================================
# TAMIL
# HAVE A TAMIL SPEAKER CHECK THESE BEFORE THE RUN. A wrong term returns
# nothing rather than failing visibly, so a zero result tells you nothing
# about which it was.
# ============================================================

tamil:
  - விளையாட்டு உதவித்தொகை தமிழ்நாடு விண்ணப்பம்
  - விளையாட்டு ஒதுக்கீடு வேலைவாய்ப்பு அறிவிப்பு
  - விளையாட்டு ஒதுக்கீடு கல்லூரி சேர்க்கை
  - விளையாட்டு விடுதி சேர்க்கை தேர்வு
  - விளையாட்டு வீரர் அரசு உதவி திட்டம்
  - சிலம்பம் உதவித்தொகை தமிழ்நாடு
  - மாவட்ட விளையாட்டு அலுவலகம் கோயம்புத்தூர்


